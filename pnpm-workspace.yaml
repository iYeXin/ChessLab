packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+: allowlist for dependency build scripts.
allowBuilds:
  esbuild: true

confirmModulesPurge: false

# React Native's codegen resolves @babel/* from arbitrary library directories
# (a phantom dependency under npm/yarn's flat layout). Hoist it like yarn did.
publicHoistPattern:
  - "@babel/*"

patchedDependencies:
  '@react-native/gradle-plugin@0.84.1': patches/@react-native__gradle-plugin@0.84.1.patch
