[package]
name = "chessnext"
version = "0.4.0-alpha"
description = "Experimental xiangqi-only research build (Pikafish)"
license = "MIT"
edition = "2021"

[lib]
name = "chessnext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
libc = "0.2"

[profile.release]
strip = true
lto = true
