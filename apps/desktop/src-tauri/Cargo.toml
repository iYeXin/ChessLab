[package]
name = "chesslab"
version = "0.2.0"
description = "ChessLab — chess & xiangqi (Stockfish / Pikafish)"
edition = "2021"

[lib]
name = "chesslab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
